# Боевой стенд платформы. Разворачивается на отдельном хосте: держать её на одной
# машине с действующей панелью нельзя — не хватит памяти, и два control-plane не должны
# делить ноды (см. docs/migration.md, раздел cutover).
#
# Образы сюда приезжают ГОТОВЫМИ из GHCR и прибиты по digest (release.env), а не
# собираются на хосте: у прод-машины 2 vCPU / 4 ГБ, и pnpm-сборка трёх образов на ней —
# это и риск OOM ровно в момент обновления, и артефакт, отличный от прошедшего CI.
# Локальная сборка — оверлеем docker-compose.build.yml.
#
# Релиз накатывается одной командой: deploy/release.sh <sha>. Ручной порядок и
# разбор шагов — docs/deploy.md.
#
# Порты наружу торчат только у caddy. postgres и redis слушают внутри сети.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vpn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?нужен POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vpn_platform}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vpn} -d ${POSTGRES_DB:-vpn_platform}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Разовая команда: docker compose run --rm migrate
  # Своей сборки нет намеренно: берём ровно тот образ, что поедет в core, иначе
  # миграции могут накатиться версией кода, отличной от разворачиваемой.
  migrate:
    image: ${CORE_IMAGE:-ghcr.io/gavrilov-daniil/corelink-core:local}
    profiles: ["tools"]
    logging: *logging
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vpn}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vpn_platform}
    command: ["node", "node_modules/@corelink/db/dist/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy

  core:
    image: ${CORE_IMAGE:-ghcr.io/gavrilov-daniil/corelink-core:local}
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      INSTANCE_TYPE: api
      DATABASE_URL: postgres://${POSTGRES_USER:-vpn}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vpn_platform}
      REDIS_URL: redis://redis:6379
      BOT_INTERNAL_URL: http://bot:3300
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Тот же образ, режим worker: cron-эмиттер выбирается advisory-lock'ом,
  # поэтому лишний инстанс расписание не задвоит.
  worker:
    image: ${CORE_IMAGE:-ghcr.io/gavrilov-daniil/corelink-core:local}
    restart: unless-stopped
    logging: *logging
    # HEALTHCHECK из образа снят намеренно: он стучится в HTTP-порт, а в режиме worker
    # процесс его не открывает вовсе (apps/core/src/main.ts) — контейнер навсегда
    # оставался бы unhealthy. Постоянно горящая ложная тревога хуже её отсутствия;
    # живость воркера видно по прогонам джоб на экране «Джобы» в админке.
    healthcheck:
      disable: true
    env_file: .env
    environment:
      INSTANCE_TYPE: worker
      DATABASE_URL: postgres://${POSTGRES_USER:-vpn}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vpn_platform}
      REDIS_URL: redis://redis:6379
      BOT_INTERNAL_URL: http://bot:3300
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  bot:
    image: ${BOT_IMAGE:-ghcr.io/gavrilov-daniil/corelink-bot:local}
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      CORE_API_URL: http://core:3100
    depends_on:
      - core

  # Раскладывает статику админки в volume, из которого её отдаёт caddy.
  # Публикация через переименование каталога: прежний вариант делал `rm -rf /out/*`
  # и на время копирования админка отдавала 404. Здесь наружу видна либо старая
  # версия целиком, либо новая целиком.
  admin-build:
    image: ${ADMIN_IMAGE:-ghcr.io/gavrilov-daniil/corelink-admin:local}
    logging: *logging
    volumes:
      - admin-dist:/out
    command:
      - sh
      - -ec
      - |
        rm -rf /out/.staging /out/.old
        mkdir -p /out/.staging
        cp -r /dist/. /out/.staging/
        if [ -d /out/current ]; then mv /out/current /out/.old; fi
        mv /out/.staging /out/current
        rm -rf /out/.old

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      # ДОМЕН МЕНЯТЬ НЕЛЬЗЯ: у мигрируемых клиентов он зашит в сохранённой ссылке
      # подписки. Смена = молчаливый отвал всей базы (docs/migration.md, P0-2).
      SUB_DOMAIN: ${SUB_PUBLIC_HOST:?нужен SUB_PUBLIC_HOST}
      ADMIN_DOMAIN: ${ADMIN_PUBLIC_HOST:?нужен ADMIN_PUBLIC_HOST}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - admin-dist:/srv/admin:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      core:
        condition: service_started
      # Иначе caddy стартует, пока статика ещё раскладывается, и первые запросы к
      # админке уходят в 404 на пустой каталог.
      admin-build:
        condition: service_completed_successfully

volumes:
  pgdata:
  redisdata:
  admin-dist:
  caddydata:
  caddyconfig:
