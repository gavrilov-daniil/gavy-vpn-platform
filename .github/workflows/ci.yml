name: ci

on:
  push:
    branches: [main]
  pull_request:

# Репозиторий публичный: секретов в прогоне нет и быть не должно.
# Все значения ниже — фиктивные, но валидные по формату (core падает на старте,
# если SECRETS_MASTER_KEY пуст или короче 16 символов).
env:
  SECRETS_MASTER_KEY: ci-fake-master-key-0123456789
  ADMIN_TOKEN: ci-fake-admin-token
  SERVICE_TOKEN: ci-fake-service-token

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    # Часть тестов apps/core работает против живого Postgres (apps/core/src/testing/fixtures.test.ts),
    # изолируясь собственным org_id на процесс. Без базы они не «скипаются», а падают.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vpn
          POSTGRES_PASSWORD: vpn
          POSTGRES_DB: vpn_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vpn -d vpn_platform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Redis-режимы лимитера и идемпотентности скипаются без адреса, а проверяют они
      # ровно то, что не воспроизводится в памяти: общий барьер между инстансами api.
      # Дефект «первые запросы после старта уходят мимо барьера» всплыл только здесь.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://vpn:vpn@localhost:5432/vpn_platform
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      # Версия не задаётся: pnpm/action-setup@v4 берёт её из packageManager в
      # package.json и падает, если ту же версию продублировать здесь.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - name: Схема для тестов
        run: pnpm --filter @corelink/db build && pnpm --filter @corelink/db migrate

      # ВРЕМЕННО: turbo на GitHub Actions буферизует вывод задачи и при зависании не
      # печатает ничего. stream + жёсткий таймаут показывают, на каком тесте встаёт.
      - name: Тесты
        run: |
          TURBO_LOG_ORDER=stream timeout -k 10 420 pnpm test || {
            echo "=== процессы ==="; ps -ef | tail -30
            echo "=== соединения ==="; ss -tanp 2>/dev/null | head -30
            exit 1
          }

      - run: pnpm build

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/node-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/node-agent/go.sum

      - run: go vet ./...

      # gofmt всегда выходит с 0 — падаем сами, если список файлов непустой
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt не применён к файлам:"
            echo "$unformatted"
            exit 1
          fi

      - run: go test ./...

      # Кросс-сборка linux/amd64 + linux/arm64: на ноды уезжает статический бинарник,
      # и ломается она обычно не компиляцией, а тегами сборки под чужой GOOS.
      - run: make all

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vpn
          POSTGRES_PASSWORD: vpn
          POSTGRES_DB: vpn_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vpn -d vpn_platform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://vpn:vpn@localhost:5432/vpn_platform
    steps:
      - uses: actions/checkout@v4

      # Версия не задаётся: pnpm/action-setup@v4 берёт её из packageManager в
      # package.json и падает, если ту же версию продублировать здесь.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @corelink/db build

      - run: pnpm --filter @corelink/db migrate

      # Проверка ловит грабли с `when` в _journal.json: drizzle применяет миграции
      # по возрастанию `when` и МОЛЧА пропускает ту, у которой он меньше уже
      # применённой. Без сверки счётчиков прогон остаётся зелёным, а колонки в БД нет.
      - name: Все миграции применены
        working-directory: packages/db
        run: |
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            import postgres from "postgres";

            const journal = JSON.parse(await readFile("drizzle/meta/_journal.json", "utf8"));
            const sql = postgres(process.env.DATABASE_URL, { max: 1 });
            const applied = await sql`select created_at from drizzle.__drizzle_migrations order by created_at`;
            await sql.end();

            console.log(`в журнале ${journal.entries.length}, применено ${applied.length}`);
            if (applied.length !== journal.entries.length) {
              console.error("применились не все миграции: у новой when в _journal.json обязан быть строго больше максимального существующего");
              process.exit(1);
            }

            const whens = journal.entries.map((e) => e.when);
            for (let i = 1; i < whens.length; i += 1) {
              if (whens[i] <= whens[i - 1]) {
                console.error(`_journal.json: when не растёт на записи ${journal.entries[i].tag}`);
                process.exit(1);
              }
            }
          '

  # Деплой-путь. Появился после того, как аудит нашёл три P0 разом: Caddy падал на
  # пустом ACME_EMAIL, команда миграций ссылалась на несуществующий drizzle-kit,
  # а /internal/agent/* не проксировался — ни одна нода не могла бы подключиться.
  # Ни один из трёх не ловился прежним CI: он собирал код, но не образы и не стенд.
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Фиктивные, но валидные по формату значения: без них compose не раскрывается
      - name: Тестовый .env
        run: |
          cat > .env <<'EOF'
          POSTGRES_PASSWORD=ci-postgres-pw
          SECRETS_MASTER_KEY=ci-fake-master-key-0123456789
          ADMIN_TOKEN=ci-fake-admin-token
          SERVICE_TOKEN=ci-fake-service-token
          SUB_PUBLIC_HOST=sub.localhost
          ADMIN_PUBLIC_HOST=admin.localhost
          BOT_TOKEN=111111:ci-fake-bot-token
          EOF

      # ACME_EMAIL намеренно пуст: именно на этом Caddy падал со «wrong argument count»,
      # а падение Caddy = разом недоступны выдача подписки, вебхуки оплат и админка.
      - name: Caddyfile валиден при пустом ACME_EMAIL
        run: |
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e SUB_DOMAIN=sub.localhost -e ADMIN_DOMAIN=admin.localhost -e ACME_EMAIL= \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Вход агентов проксируется
        run: |
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e SUB_DOMAIN=sub.localhost -e ADMIN_DOMAIN=admin.localhost \
            caddy:2-alpine caddy adapt --config /etc/caddy/Caddyfile > adapted.json
          grep -q '/internal/agent/\*' adapted.json \
            || { echo "в Caddyfile нет маршрута /internal/agent/* — ноды не смогут подключиться"; exit 1; }

      - name: Сборка образов
        run: docker compose -f docker-compose.prod.yml build

      - name: БД
        run: |
          docker compose -f docker-compose.prod.yml up -d postgres redis
          timeout 90 sh -c 'until docker compose -f docker-compose.prod.yml exec -T postgres pg_isready -U vpn -d vpn_platform; do sleep 2; done'

      # Тот же образ и та же команда, что в docs/deploy.md
      - name: Миграции из боевого образа
        run: docker compose -f docker-compose.prod.yml run --rm migrate

      - name: Стенд
        run: docker compose -f docker-compose.prod.yml up -d core worker admin-build caddy

      - name: Смоук через Caddy
        run: |
          timeout 90 sh -c 'until curl -sk --resolve sub.localhost:443:127.0.0.1 https://sub.localhost/healthz | grep -q "\"ok\":true"; do sleep 3; done'

          # Ручка агентов должна отвечать 401 (нет токена), а не 404: 404 означал бы,
          # что запрос до core не доходит.
          code=$(curl -sk -o /dev/null -w '%{http_code}' -X POST \
            --resolve sub.localhost:443:127.0.0.1 https://sub.localhost/internal/agent/enroll \
            -H 'content-type: application/json' -d '{}')
          echo "/internal/agent/enroll → $code"
          [ "$code" = "404" ] && { echo "агенты не достучатся до core"; exit 1; }

          # Админский API не должен быть виден на домене подписки
          code=$(curl -sk -o /dev/null -w '%{http_code}' \
            --resolve sub.localhost:443:127.0.0.1 https://sub.localhost/api/admin/merchants)
          echo "админка на домене подписки → $code"
          [ "$code" = "404" ] || { echo "админский API торчит на домене подписки"; exit 1; }

          # А на своём домене — отвечает и требует токен
          code=$(curl -sk -o /dev/null -w '%{http_code}' \
            --resolve admin.localhost:443:127.0.0.1 https://admin.localhost/api/admin/merchants)
          echo "админка на своём домене → $code"
          [ "$code" = "401" ] || { echo "ожидался 401 без токена"; exit 1; }

      - name: Логи при падении
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --tail=80

      - name: Убрать стенд
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v
